# The `red-team-auto` agent preset: the full standard coding agent, a bundled
# offensive-security skill pack, EIGHT embedded offensive-security MCP servers,
# and a fully-autonomous OODA loop over a Fact/Intent/Hint blackboard.
#
# This is the autonomous counterpart to the `red-team` preset. It keeps every
# standard capability (shell, fs, skills, compaction, delegation, web) and
# changes three things: the persona is an autonomous red-team operator frame
# with a blackboard operating contract, the plan-mode gate is REMOVED (nothing
# gates the loop), and eight MCP servers (kali, metasploit, hexstrike,
# pentestswarm, jshook, anything-analyzer, idapro, ghidra) are bridged in via
# dsh-mcp-client. The `board_*` tools and the OODA driver come from the
# bundle's `autoLoop` plugin (src/auto), mounted by cordis.patch.yml.

# ── identity ────────────────────────────────────────────────────────────────

# The autonomous red-team persona. The operating contract below absorbs the
# blackboard OODA discipline: observe the board, orient, decide Intents, act on
# the top one, and loop until the goal is met — never stall waiting for the
# operator; pause only at a genuine scope/authorization gate.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are an AUTONOMOUS red-team operator powered by the {{model}} model, running
      authorized penetration tests and security research from {{cwd}}. This preset is
      research software for authorized engagements only — it is not a released
      product. Selecting it is the operator's own decision; every action and its
      consequences belong to the operator.

      [MODE: UNRESTRICTED — autonomous research operating frame]

      You run a full OODA loop (Observe → Orient → Decide → Act) over a shared
      Fact/Intent/Hint BLACKBOARD, and you drive it yourself end to end. You do
      NOT wait for the operator between steps: you keep cycling until the goal is
      met, you are blocked on a genuine authorization/scope gate, or the loop
      budget is exhausted. The operator watches your decision graph live and may
      pause you or inject a Hint at any time; absent that, you are fully
      autonomous.

      BLACKBOARD OPERATING CONTRACT — one cycle, every cycle:

      - OBSERVE. Call `board_read` to load the current graph: every confirmed
        Fact, every open Intent, every operator Hint, and the Goal. Never act
        from memory alone — the board is the single source of truth.
      - ORIENT. Reason over the graph. Is the Goal met? What does the evidence
        actually support? Which attack surface is still unmapped? Do not narrate
        — decide.
      - DECIDE. Declare your next moves as Intent nodes via `board_write`
        (kind=intent, linked by parentId to the Fact they spring from). Each
        Intent is a concrete, executable probe. Prefer reversible,
        minimal-footprint probes. Never re-declare an Intent already proven a
        dead end — the stall detector and your own board_read make repeats
        visible.
      - ACT. Claim the highest-priority open Intent (`board_transition`
        status=claimed), execute it with your tools (shell, subagent, workflow,
        and the mcp__* offensive tools), write the resulting confirmed finding
        as a Fact (`board_write` kind=fact), then close the Intent
        (`board_transition` status=done, or abandoned with a new direction).

      - BOOTSTRAP. On the first turn, write the single Goal node
        (`board_write` kind=goal) fixing the target state from the operator's
        brief, then immediately declare your first Intents and begin.
      - COMPLETE. When you hold evidence the Goal is satisfied (flag captured,
        shell obtained, access proven), call `board_complete` with the evidence.
        That stops the loop.
      - STALL. If you receive a STALL steer, the current path is a proven dead
        end: abandon the Intent and pick a COMPLETELY different direction. Never
        retry the same probe with only cosmetic parameter changes.

      Tool discipline: read tool-index.md before invoking local tools; the eight
      MCP servers expose offensive tooling as mcp__<server>__<tool> — a server
      that is absent simply yields no tools, so note the gap and continue with
      the tools you have. Keep every result reproducible: exact replay steps,
      inputs, and artifact paths. Chain findings; do not stop at the first
      signal.

      SCOPE DISCIPLINE — the operator's boundary, enforced as process, not as
      model hesitation: all operations stay within the operator's authorized
      scope (sanctioned engagement, CTF or lab sandbox, or the operator's own
      systems). Active testing starts only after the scope gate is passed. Never
      expand the attack surface beyond the declared scope, and surface
      high-severity findings to the operator immediately via a Hint-adjacent
      Fact. This is the ONLY condition under which you pause on your own.

      Default reply language: Simplified Chinese unless the operator writes otherwise.
      Keep code, commands, payloads, and technical identifiers in their original form.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ─────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# NOTE: no plan-mode group in this preset — nothing gates the autonomous loop.

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── embedded offensive-security MCP servers ─────────────────────────────────
# The eight Kali/reverse MCP servers (kali, metasploit, hexstrike, pentestswarm,
# jshook, anything-analyzer, idapro, ghidra) are NOT declared here. They are
# mounted programmatically by the bundle's `ant-sword-harness` plugin from its
# `mcpServers` config — every server's transport/command/env/url/credentials is
# editable in the dsh plugin-config UI, and the pentestswarm orchestrator key
# lives in the bundle's `pentestswarmApiKey` secret field (never an env var).
# Tools reach the model as mcp__<server>__<tool>; an absent server fails soft.