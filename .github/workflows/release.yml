name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (defaults to v<package version>)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm via corepack
        shell: pwsh
        run: |
          corepack enable
          pnpm --version

      - name: Publish complete offline release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ inputs.tag }}"
          $args = @('scripts/release-github.mjs', '--repo', '${{ github.repository }}', '--output', '.release')
          if (-not [string]::IsNullOrWhiteSpace($tag)) { $args += @('--tag', $tag) }
          node @args
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }